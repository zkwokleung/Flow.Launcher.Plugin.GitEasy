name: release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: Flow.Launcher.Plugin.GitEasy

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure release paths
        run: |
          "PUBLISH_PATH=$env:RUNNER_TEMP\giteasy-release\Flow.Launcher.Plugin.GitEasy" >> $env:GITHUB_ENV
          "ARCHIVE_PATH=$env:RUNNER_TEMP\Flow.Launcher.Plugin.GitEasy.zip" >> $env:GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $manifest = Get-Content -LiteralPath "plugin.json" -Raw | ConvertFrom-Json

          if ($env:RELEASE_TAG -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+)$') {
            throw "Release tag '$env:RELEASE_TAG' must use vMAJOR.MINOR.PATCH."
          }

          $tagVersion = $Matches.version
          if (![string]::Equals($tagVersion, [string]$manifest.Version, [StringComparison]::Ordinal)) {
            throw "Release tag '$env:RELEASE_TAG' does not match plugin version '$($manifest.Version)'."
          }

          "version=$tagVersion" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore -r win-x64

      - name: Verify formatting
        run: dotnet format whitespace --verify-no-changes --no-restore

      - name: Publish plugin
        run: >-
          dotnet publish
          -c Release
          -r win-x64
          --no-self-contained
          --no-restore
          --output "$env:PUBLISH_PATH"

      - name: Verify and package plugin
        id: package
        run: |
          $requiredPaths = @(
            "plugin.json",
            "Flow.Launcher.Plugin.GitEasy.dll",
            "Images",
            "Languages"
          )

          foreach ($requiredPath in $requiredPaths) {
            $publishedPath = Join-Path $env:PUBLISH_PATH $requiredPath
            if (!(Test-Path -LiteralPath $publishedPath)) {
              throw "Published plugin is missing '$requiredPath'."
            }
          }

          $archiveItems = Get-ChildItem -LiteralPath $env:PUBLISH_PATH
          Compress-Archive -LiteralPath $archiveItems.FullName -DestinationPath $env:ARCHIVE_PATH -CompressionLevel Optimal

          if (!(Test-Path -LiteralPath $env:ARCHIVE_PATH)) {
            throw "Plugin archive was not created."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($env:ARCHIVE_PATH)
          try {
            $archiveEntries = $archive.Entries.FullName
            foreach ($rootEntry in @("plugin.json", "Flow.Launcher.Plugin.GitEasy.dll")) {
              if ($archiveEntries -notcontains $rootEntry) {
                throw "Plugin archive is missing root entry '$rootEntry'."
              }
            }
          }
          finally {
            $archive.Dispose()
          }

          "archive_path=$env:ARCHIVE_PATH" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.package.outputs.archive_path }}
          name: Git Easy ${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true